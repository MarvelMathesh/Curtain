 </linearGradient>
 <linearGradient id="front" x1="560" y1="220" x2="830" y2="760" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFFFFF"/><stop offset=".48" stop-color="#F9FAFC"/><stop offset=".78" stop-color="#EFF2F6"/><stop offset="1" stop-color="#E4E8EE"/>
 </linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
   <stop stop-color="#A9B1BC" stop-opacity=".28"/><stop offset=".55" stop-color="#C9CED6" stop-opacity=".10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
 </linearGradient>
 <filter id="shadow" x="-30%" y="-25%" width="160%" height="160%">
   <feDropShadow dx="1" dy="5" stdDeviation="7" flood-color="#7D8794" flood-opacity=".15"/>
 </filter>
</defs>

