<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none">
<title>Curtain</title>
<desc>Minimal three-fold curtain mark and the Curtain wordmark, rendered as scalable vector paths.</desc>
<defs>
 <linearGradient id="back" x1="420" y1="220" x2="575" y2="780" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#F2F4F7"/><stop offset="1" stop-color="#E6EAF0"/>
 </linearGradient>
 <linearGradient id="mid" x1="470" y1="220" x2="620" y2="780" gradientUnits="userSpaceOnUse">
